<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scroll Counter</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="input-scroll.js"></script>
    <script defer src="input-chevron.js"></script>
    <script defer src="input-buttons.js"></script>
  </head>
  <body>
    <div class="flex">
      <div class="counter-container">
        <input type="text" id="scrollCount" value="0" readonly />
        <div style="position: relative">
          <div id="upperBound" class="drag-indicator"></div>
          <svg id="scrollButton" class="scroll-button" alt="Scroll button" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle class="scroll-icon__circle" cx="12" cy="12" r="5" transform="rotate(90 12 12)" fill="#1E75DF" />
            <path class="scroll-icon__arrow-up" d="M9 3L12 1L15 3" stroke="#1E75DF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            <path class="scroll-icon__arrow-down" d="M15 21L12 23L9 21" stroke="#1E75DF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <div id="lowerBound" class="drag-indicator"></div>
        </div>
      </div>

      <div class="chevron-counter-container">
        <input type="text" id="chevronCount" value="0" readonly />
        <svg class="chevron chevron-up" viewBox="0 0 24 24">
          <path d="M12 8l-6 6 1.41 1.41L12 10.83l4.59 4.58L18 14z" />
        </svg>
        <svg class="chevron chevron-down" viewBox="0 0 24 24">
          <path d="M12 8l-6 6 1.41 1.41L12 10.83l4.59 4.58L18 14z" />
        </svg>
      </div>

      <div class="button-counter-container">
        <div class="button-counter-wrapper">
          <input type="text" id="buttonCount" value="0" readonly />
          <div class="button-controls">
            <button class="button-chevron button-chevron-up button-up">
              <svg viewBox="0 0 24 24" width="16" height="16">
                <path d="M12 8l-6 6 1.41 1.41L12 10.83l4.59 4.58L18 14z" />
              </svg>
            </button>
            <button class="button-chevron button-chevron-down button-down">
              <svg viewBox="0 0 24 24" width="16" height="16" style="transform: rotate(180deg)">
                <path d="M12 8l-6 6 1.41 1.41L12 10.83l4.59 4.58L18 14z" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
